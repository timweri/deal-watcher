[package]
name = "deal-watcher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = "0.4"
dotenvy = "0.15"
envy = "0.4"
hex = "0.4"
rand = "0.10"
regex = "1.13"
reqwest = { version = "0.13", features = ["json", "query"] }
reqwest-middleware = { version = "0.5", features = ["query", "json"] }
reqwest-retry = "0.9"
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3.27"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tokio-cron-scheduler = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27"
wiremock = "0.6"
